name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, kfc/endless-mode]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Compile
        run: |
          mkdir -p bin
          javac -encoding UTF-8 -Xlint:all -d bin $(find src tests -name '*.java')

      - name: Endless regression tests
        run: java -ea -Djava.awt.headless=true -cp bin:res engine.EndlessRunTest

      - name: Check resources referenced by code exist
        run: test -f res/graphics && test -f res/scores
